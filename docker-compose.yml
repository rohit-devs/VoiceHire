services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicehire
      POSTGRES_USER: voicehire
      POSTGRES_PASSWORD: voicehire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://voicehire:voicehire@postgres:5432/voicehire
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
volumes:
  postgres_data:
